AWSTemplateFormatVersion: '2010-09-09'
Description: Orot bounded-session GPU host; private inference, persistent encrypted model cache
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  SubnetId: {Type: 'AWS::EC2::Subnet::Id'}
  WebSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  WebInstanceRoleName: {Type: String}
  GitHubDeploymentRoleName: {Type: String}
  GpuAmiId:
    Type: AWS::EC2::Image::Id
    Description: Verified official Amazon Linux 2023 GPU AMI with NVIDIA Docker runtime
  InstanceType: {Type: String, Default: g5.xlarge, AllowedValues: [g5.xlarge]}
  RootVolumeGb: {Type: Number, Default: 100, MinValue: 100, MaxValue: 100}
  SessionMinutes: {Type: Number, Default: 90, MinValue: 15, MaxValue: 180}
Resources:
  InferenceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Orot private vLLM token generated by AWS; never committed or printed
      GenerateSecretString: {PasswordLength: 48, ExcludePunctuation: true}
      Tags: [{Key: Project, Value: orot-ai}]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /orot-ai/inference, RetentionInDays: 14}
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private inference from designated Orot web security group only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref WebSecurityGroupId}
      Tags: [{Key: Project, Value: orot-ai}]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: ReadOnlyInferenceImageAndToken
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: ['ecr:BatchGetImage', 'ecr:GetDownloadUrlForLayer', 'ecr:BatchCheckLayerAvailability']
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/orot-ai-inference
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref InferenceSecret}
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/orot-ai/inference:*
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  GpuInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref GpuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      InstanceInitiatedShutdownBehavior: stop
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: true
          GroupSet: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: !Ref RootVolumeGb, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: orot-ai-inference}, {Key: Project, Value: orot-ai}, {Key: Role, Value: inference}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          umask 077
          cat > /etc/systemd/system/orot-gpu-stop.service <<'UNIT'
          [Unit]
          Description=Stop Orot GPU at the end of its experiment session
          [Service]
          Type=oneshot
          ExecStart=/usr/sbin/shutdown -h now
          UNIT
          cat > /etc/systemd/system/orot-gpu-stop.timer <<'UNIT'
          [Unit]
          Description=Bound GPU running time after every boot
          [Timer]
          OnBootSec=${SessionMinutes}min
          Unit=orot-gpu-stop.service
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now orot-gpu-stop.timer
          systemctl disable --now ecs || true
          dnf install -y python3 curl awscli-2 amazon-ssm-agent
          systemctl enable --now docker amazon-ssm-agent
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/orot-inference
          chmod 700 /opt/orot-inference
          curl --fail --location --retry 3 https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 -o /tmp/docker-compose-linux-x86_64
          curl --fail --location --retry 3 https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64.sha256 -o /tmp/docker-compose-linux-x86_64.sha256
          (cd /tmp && sha256sum -c docker-compose-linux-x86_64.sha256)
          install -m 755 /tmp/docker-compose-linux-x86_64 /usr/local/lib/docker/cli-plugins/docker-compose
          nvidia-smi
          docker compose version
  WebReadsInferenceToken:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ReadOrotInferenceToken
      Roles: [!Ref WebInstanceRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref InferenceSecret}]
  GitHubDeploysOnlyThisGpu:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: DeployOnlyOrotInferenceHost
      Roles: [!Ref GitHubDeploymentRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${GpuInstance}
Outputs:
  InstanceId: {Value: !Ref GpuInstance}
  PrivateIpv4: {Value: !GetAtt GpuInstance.PrivateIp}
  InferenceSecretArn: {Value: !Ref InferenceSecret}
  SecurityGroupId: {Value: !Ref SecurityGroup}
