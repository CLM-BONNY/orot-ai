AWSTemplateFormatVersion: '2010-09-09'
Description: Orot AI immutable image repositories (no compute instances)
Resources:
  WebRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: orot-ai-web
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: orot-ai-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
  InferenceRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: orot-ai-inference
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
Outputs:
  WebRepositoryUri: {Value: !GetAtt WebRepository.RepositoryUri}
  ApiRepositoryUri: {Value: !GetAtt ApiRepository.RepositoryUri}
  InferenceRepositoryUri: {Value: !GetAtt InferenceRepository.RepositoryUri}
