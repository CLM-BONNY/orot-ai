AWSTemplateFormatVersion: '2010-09-09'
Description: Orot AI low-cost web/API EC2, fixed address, SSM and logging; no GPU instance
Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, m7i.large]
    Description: t3.small for always-on operation; m7i.large for a separate fixed-spec benchmark
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  ComposeVersion:
    Type: String
    Default: v5.6.0
    AllowedPattern: 'v[0-9]+\.[0-9]+\.[0-9]+'
  InferenceSecretArn:
    Type: String
    Default: ''
    Description: Optional inference secret, only after GPU experiments are configured
  SiteLoginSecretArn:
    Type: String
    Description: Existing Secrets Manager secret containing the htpasswd login line
  DomainName:
    Type: String
    Default: ''
    Description: Domain to point at the fixed IP, after registration
  HostedZoneId:
    Type: String
    Default: ''
    Description: Leave empty to configure DNS at another registrar
Conditions:
  CreateDns: !And [!Not [!Equals [!Ref HostedZoneId, '']], !Not [!Equals [!Ref DomainName, '']]]
  IsBurstable: !Or [!Equals [!Ref InstanceType, t3.micro], !Equals [!Ref InstanceType, t3.small]]
  HasInferenceSecret: !Not [!Equals [!Ref InferenceSecretArn, '']]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Project, Value: orot-ai}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  Routes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref Routes, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnet, RouteTableId: !Ref Routes}
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP/HTTPS only; no SSH and no API/model ports
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  ApplicationLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {LogGroupName: /orot-ai/application, RetentionInDays: 14}
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullApplicationImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*'}
              - Effect: Allow
                Action: ['ecr:BatchGetImage', 'ecr:GetDownloadUrlForLayer', 'ecr:BatchCheckLayerAvailability']
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/orot-ai-web
                  - !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/orot-ai-api
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SiteLoginSecretArn
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogStreams']
                Resource: !GetAtt ApplicationLogs.Arn
        - !If
          - HasInferenceSecret
          - PolicyName: ReadInferenceSecret
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref InferenceSecretArn
          - !Ref 'AWS::NoValue'
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}
  WebInstance:
    Type: AWS::EC2::Instance
    DependsOn: [InternetRoute, RouteAssociation]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref Profile
      CreditSpecification: !If [IsBurstable, {CPUCredits: standard}, !Ref 'AWS::NoValue']
      MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: 20, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: orot-ai-web}, {Key: Project, Value: orot-ai}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/orot
          chmod 700 /opt/orot
          cd /tmp
          curl -fsSLO https://github.com/docker/compose/releases/download/${ComposeVersion}/docker-compose-linux-x86_64
          curl -fsSLO https://github.com/docker/compose/releases/download/${ComposeVersion}/docker-compose-linux-x86_64.sha256
          sha256sum -c docker-compose-linux-x86_64.sha256
          install -m 755 docker-compose-linux-x86_64 /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version
          aws --version
          python3 --version
  FixedAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc, Tags: [{Key: Project, Value: orot-ai}]}
  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties: {AllocationId: !GetAtt FixedAddress.AllocationId, InstanceId: !Ref WebInstance}
  DomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDns
    Properties: {HostedZoneId: !Ref HostedZoneId, Name: !Ref DomainName, Type: A, TTL: '300', ResourceRecords: [!Ref FixedAddress]}
Outputs:
  InstanceId: {Value: !Ref WebInstance}
  FixedIpv4: {Value: !Ref FixedAddress}
  VpcId: {Value: !Ref Vpc}
  SubnetId: {Value: !Ref PublicSubnet}
  WebSecurityGroupId: {Value: !Ref WebSecurityGroup}
