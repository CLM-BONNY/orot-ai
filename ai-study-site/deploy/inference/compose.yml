name: orot-ai-inference
services:
  inference:
    image: ${INFERENCE_IMAGE:?Use a private ECR image digest}
    restart: unless-stopped
    environment:
      MODEL_REPO: ${MODEL_REPO}
      MODEL_REVISION: ${MODEL_REVISION}
      MODEL_NAME: ${MODEL_NAME}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-4096}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-4}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.9}
      LANGUAGE_MODEL_ONLY: 'true'
      ENFORCE_EAGER: 'true'
      VLLM_API_KEY_FILE: /run/secrets/inference_token
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
    secrets: [inference_token]
    volumes: [/opt/orot-inference/model-cache:/models]
    ports: ['${PRIVATE_IPV4:?Use GPU private IPv4}:8000:8000', '127.0.0.1:8000:8000']
    gpus: all
    shm_size: 1gb
    init: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 5
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /orot-ai/inference
        awslogs-stream: vllm
secrets:
  inference_token: {file: '${SECRETS_DIR}/inference_token'}
