name: Publish private inference image
on:
  workflow_dispatch:
    inputs:
      vllm_base_image:
        description: Verified official vLLM image pinned with @sha256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aws-production
  cancel-in-progress: false
jobs:
  inference:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      VLLM_BASE_IMAGE: ${{ inputs.vllm_base_image }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check immutable official base image
        run: |
          [[ "$VLLM_BASE_IMAGE" =~ ^vllm/vllm-openai@sha256:[a-f0-9]{64}$ ]]
          test -n "$AWS_REGION"
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login and determine ECR image
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "IMAGE_URI=$registry/orot-ai-inference:$IMAGE_TAG" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ai-study-site/deploy/inference/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_URI }}
          build-args: VLLM_BASE_IMAGE=${{ env.VLLM_BASE_IMAGE }}
      - name: Record immutable inference image
        run: |
          digest=$(aws ecr describe-images --repository-name orot-ai-inference --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          printf '%s\n' "${IMAGE_URI%:*}@$digest" > inference-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inference-image-${{ env.IMAGE_TAG }}
          path: inference-image.txt
