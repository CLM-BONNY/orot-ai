name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-study-site/backend/requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-study-site/frontend/package-lock.json
      - run: python -m pip install -r ai-study-site/backend/requirements.txt
      - run: python -m pytest backend/tests deploy/inference/test_launch.py deploy/inference/test_gpu_release.py deploy/ec2/test_release.py deploy/ec2/test_gpu_session.py -q -p no:cacheprovider
        working-directory: ai-study-site
      - name: Validate active AWS infrastructure templates
        run: |
          python -m pip install cfn-lint==1.57.2
          cfn-lint -t ai-study-site/deploy/cloudformation/*.yml --non-zero-exit-code error
      - run: npm ci
        working-directory: ai-study-site/frontend
      - run: npm test && npm run build
        working-directory: ai-study-site/frontend
  containers:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFERENCE_PROVIDER: disabled
      APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and start web/API containers
        run: docker compose -f ai-study-site/deploy/compose.yml up --build --wait --wait-timeout 120
        env:
          APP_REVISION: ${{ github.sha }}
      - name: Verify production HTTP routes, content and proxy errors
        run: python3 ai-study-site/deploy/scripts/container_smoke.py --expect-ai-disabled
      - name: Validate production TLS proxy configuration
        run: docker run --rm -e APP_DOMAIN=example.com -v "$PWD/ai-study-site/deploy/ec2/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f caddy validate --config /etc/caddy/Caddyfile
      - name: Test production-style site access control using a disposable fixture
        run: |
          python3 -c "import pathlib,subprocess; hashed=subprocess.run(['openssl','passwd','-6','-stdin'],input='fixture-password\n',text=True,capture_output=True,check=True).stdout.strip(); pathlib.Path('/tmp/orot-fixture.htpasswd').write_text('fixture-user:'+hashed+'\n')"
          chmod 644 /tmp/orot-fixture.htpasswd
          docker compose -f ai-study-site/deploy/compose.yml -f ai-study-site/deploy/docker/web/auth-smoke.override.yml up -d --wait --wait-timeout 120
          python3 ai-study-site/deploy/scripts/auth_smoke.py
        env:
          SITE_LOGIN_FIXTURE: /tmp/orot-fixture.htpasswd
      - name: Collect container logs on failure
        if: failure()
        run: docker compose -f ai-study-site/deploy/compose.yml logs --no-color --tail 100
      - name: Stop containers
        if: always()
        run: docker compose -f ai-study-site/deploy/compose.yml down
